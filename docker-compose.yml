services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealer
      POSTGRES_PASSWORD: dealer
      POSTGRES_DB: dealership
    ports:
      - "5432:5432"
    volumes:
      - dealership_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealer -d dealership"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dealership_data:
